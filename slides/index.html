<style>
:root{
  --bg:#f5f4ef; --ink:#1a1b18; --sub:#6c6d65; --faint:#bdbcb3; --rule:#dedcd3;
  --a:#2f7d4a; --b:#2b62a0; --p3:#8a4f9e; --warn:#b03f2b;
  --hl-a:#d3e8cc; --hl-b:#d2e0f2;
  --code-bg:#fbfaf7; --code-bd:#e1dfd6;
  --t-var:#7d4692; --t-str:#94591a; --t-kw:#2b62a0; --t-meta:#227069; --t-esc:#a65a28; --t-op:#b03f2b; --t-cmt:#a09f96; --t-punct:#7b7c74;
  --sans:"Deck Sans","LINE Seed JP","Hiragino Sans","Noto Sans JP",sans-serif;
  --mono:"Deck Mono","Monaspace Neon","SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
body{font-family:var(--sans);font-weight:400;font-feature-settings:"palt" 1;font-kerning:normal;
  text-autospace:no-autospace;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;overflow:hidden;background:var(--bg)}
#bar{position:absolute;left:0;bottom:0;height:4px;background:var(--a);opacity:.3;transition:width .3s ease;z-index:9}

/* ---------- frames ---------- */
.f{position:absolute;inset:0;padding:0 210px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:64px}
.f.c{align-items:center;text-align:center}
[data-k]{transform-origin:0 0}
.g{display:inline-block;white-space:pre;position:relative}
.mono,.g,.code,.data{font-family:var(--mono);font-feature-settings:"liga" 0,"calt" 1}

/* type scale — display 190 / title 150 / lead 88 / body 56 */
.display{font-size:190px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.title{font-size:150px;font-weight:800}
.nowrap{white-space:nowrap}
.msg{font-size:128px;font-weight:800;white-space:nowrap}
.huge{font-size:200px;font-weight:800;white-space:nowrap;letter-spacing:-.02em}
.cfx{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;z-index:0}
.huge{position:relative;z-index:1}
.lead{font-size:88px;font-weight:700;letter-spacing:-.01em;line-height:1.4}
.body{font-size:56px;font-weight:700;color:var(--sub);line-height:1.5}
.a{color:var(--a)} .b{color:var(--b)} .p3{color:var(--p3)} .warn{color:var(--warn)} .sub{color:var(--sub)} .faint{color:var(--faint)}

/* code: a quiet block; its background is a separate plate so it can morph */
.code{position:relative;padding:44px 68px;font-size:72px;line-height:1.55;font-weight:400;text-align:left}
.code.sm{font-size:56px;line-height:1.45;padding:32px 52px}
.code.md{font-size:50px;line-height:1.45;padding:28px 46px}
.code.xs{font-size:38px;padding:20px 34px}
.code.rules{font-size:48px;line-height:1.45;padding:28px 48px}
.code.alt{font-size:44px;line-height:1.42;padding:32px 56px}
.code .ln{white-space:pre;min-height:1em}
.code.quiz .ln:nth-child(2){margin-top:1.3em}
.plate{position:absolute;background:var(--code-bg);border:2px solid var(--code-bd);border-radius:28px}
.t-var{color:var(--t-var)} .t-str{color:var(--t-str)} .t-kw{color:var(--t-kw)} .t-meta{color:var(--t-meta)}
.t-esc{color:var(--t-esc)} .t-op{color:var(--t-op);font-weight:500} .t-cmt{color:var(--t-cmt)} .t-punct{color:var(--t-punct)}
.dimcode .g{color:var(--faint)!important}
.hole.rv{width:2.4em}
.hole{display:inline-block;width:6em;height:1.02em;vertical-align:-.18em;background:var(--hl-a);border-radius:12px;margin:0 .08em}

/* marker: one rounded rect behind a run of glyphs (drawn by the engine) */
.mark{position:absolute}
.mark.a{background:var(--hl-a)} .mark.b{background:var(--hl-b)}

/* unary data */
.data{font-size:168px;font-weight:500;line-height:1.2;white-space:nowrap}
.data.m{font-size:120px} .data.s{font-size:96px} .data.t{font-size:70px}
.chip{display:inline-block;font-size:.62em;vertical-align:.18em;padding:.04em .42em;margin:0 .08em;border-radius:.36em;background:#e8e6de;color:var(--ink);white-space:nowrap}
.chip.tbl{font-family:var(--sans);font-weight:700;background:transparent;border:3px dashed var(--faint);color:var(--sub);padding:.02em .5em}

/* conveyor: before / regex / after on a fixed grid, so nothing drifts between frames */
.conv{position:absolute;inset:0;display:grid;grid-template-rows:340px 400px 340px;justify-items:center}
.conv>.before{align-self:end}
.conv>.mid{align-self:center;display:flex;flex-direction:column;align-items:center;gap:26px}
.conv>.after{align-self:start}
.conv .tag{font-size:60px;font-weight:700;color:var(--ink)}
.conv.done>.before .g:not(.m-a):not(.m-b){color:var(--faint)}
.arr{position:absolute;left:944px;width:32px;height:52px;fill:none;stroke:var(--sub);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.arr.a1{top:370px} .arr.a2{top:658px}
.rw{position:relative;display:inline-block;white-space:nowrap}
.eq{position:absolute;left:100%;top:0;margin-left:.5em;font-family:var(--sans);font-weight:700;font-size:.8em;line-height:1.5;color:var(--a);white-space:nowrap}

/* callouts (overlay) */
.call{position:absolute;z-index:5;font-family:var(--sans);font-size:48px;font-weight:700;line-height:1;white-space:nowrap;
  padding:16px 28px 18px;border-radius:18px;background:var(--ink);border-color:var(--ink);color:#fff}
.call::after{content:"";position:absolute;left:var(--tl,calc(50% - 14px));bottom:-13px;border:14px solid transparent;border-bottom:none;border-top-color:inherit}
.call.below::after{bottom:auto;top:-13px;border:14px solid transparent;border-top:none;border-bottom-color:inherit}
.call.a{background:var(--a);border-color:var(--a)} .call.b{background:var(--b);border-color:var(--b)}
.call code{font-family:var(--mono);font-weight:500}

/* people / links */
.byline{display:flex;align-items:center;gap:28px}
.byline img{width:100px;height:100px;border-radius:50%;border:2px solid var(--rule);background:#fff}
.byline .nm{font-size:50px;font-weight:700}
.byline .ev{font-size:40px;color:var(--sub);margin-left:24px}
.intro{flex-direction:row;align-items:center;justify-content:center;gap:120px;padding:0}
.icon{width:440px;height:440px;border-radius:50%;border:2px solid var(--rule);background:#fff;display:block}
.name{font-size:168px;font-weight:700;letter-spacing:-.02em;line-height:1.05;margin-bottom:44px}
.chipx{display:inline-flex;align-items:center;gap:.36em;font-size:52px;font-weight:700;line-height:1;white-space:nowrap;
  padding:.3em .63em .32em .64em;border-radius:999px;background:var(--ink);color:var(--bg)}
/* optical: the underscores and descenders pull the mass down, so lift the content a little */
.chipx.xid{padding:.25em .63em .37em .64em}
.chipx.xid svg{position:relative;top:.06em}
.chipx svg{width:.95em;height:.95em;fill:currentColor;flex:none}
.chipx.mono{font-weight:500}

/* rules */
.bans{display:flex;gap:120px;font-size:124px;font-weight:400}
.ban{position:relative;display:inline-block}
.ban .st{position:absolute;left:-14px;right:-14px;top:50%;height:10px;margin-top:-3px;background:var(--warn);border-radius:5px;transform-origin:0 50%}

/* overview / dividers */
.ovl{display:flex;flex-direction:column;align-items:flex-start;gap:20px}
.ovit{position:relative;font-size:76px;font-weight:700;letter-spacing:-.01em;line-height:1.3;white-space:nowrap;padding:0 .26em;margin-left:-.26em}
.ovit .no{display:inline-block;width:1.3em;color:var(--a)}
.ovit.big{font-size:150px}

/* ending */
.end{position:absolute;inset:0}
.end .ttl{position:absolute;left:0;right:0;top:170px;text-align:center;white-space:nowrap}
.strk{position:relative;display:inline-block}
.pl{padding-bottom:170px}
.pl .title{font-size:200px} .pl .fix{font-size:170px}
.strk .st{position:absolute;left:-8px;right:-8px;top:52%;height:13px;background:var(--warn);border-radius:7px;transform-origin:0 50%}
.strk .fix{position:absolute;left:-50%;right:-50%;top:100%;text-align:center;font-size:124px;font-weight:800;line-height:1.1;color:var(--warn);white-space:nowrap}
.end .who{position:absolute;left:0;right:0;top:600px;display:flex;justify-content:center;align-items:center;gap:100px}
.prof{display:flex;align-items:center;gap:44px;text-align:left}
.prof img{width:188px;height:188px;border-radius:50%;border:2px solid var(--rule);background:#fff}
.prof .nm{font-size:72px;font-weight:700;line-height:1.1;margin-bottom:26px}
.vr{width:3px;height:220px;border-radius:2px;background:var(--rule)}
.repo{display:flex;align-items:center;gap:44px}
.qrc{width:300px;height:300px;padding:16px;background:#fff;border:2px solid var(--rule);border-radius:34px;color:var(--ink)}
.qrc svg{width:100%;height:100%;display:block}
.repo .chipx{font-size:50px}

/* notes overlay + presenter */
#notes{position:fixed;left:0;right:0;bottom:0;background:rgba(26,27,24,.92);color:#f5f4ef;font-size:22px;line-height:1.7;padding:18px 28px;display:none;z-index:20}
body.shownotes #notes{display:block}
#pres{display:none}
body.presenter #stage,body.presenter #notes{display:none!important}
body.presenter{overflow:auto}
body.presenter #pres{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;gap:20px 28px;padding:24px;height:100vh}
.p-top{grid-column:1/3;display:flex;gap:40px;align-items:baseline}
.p-top .clock{font-size:64px;font-weight:800;font-variant-numeric:tabular-nums}
.p-top .plan{font-size:28px;color:var(--sub)}
.p-top .late{color:var(--warn)}
.p-top button{font:inherit;font-size:18px;padding:6px 14px;border:1px solid var(--faint);background:#fff;border-radius:6px;cursor:pointer}
.p-view{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border:1px solid var(--rule);background:var(--bg)}
.p-view .inner{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.p-col{display:flex;flex-direction:column;gap:16px;min-height:0}
.p-label{font-size:16px;color:var(--sub);letter-spacing:.1em}
.p-notes{font-size:30px;line-height:1.75;overflow:auto}
</style>
</head>
<body>
<div id="stage"><div id="bar"></div></div>
<div id="notes"></div>
<div id="pres">
  <div class="p-top"><span class="clock" id="pClock">0:00</span><span class="plan" id="pPlan"></span><span class="plan" id="pIdx"></span>
    <button id="pReset">タイマーリセット</button></div>
  <div class="p-col"><div class="p-label">いま</div><div class="p-view" id="pNow"><div class="inner"></div></div>
    <div class="p-label">次</div><div class="p-view" id="pNext" style="width:60%"><div class="inner"></div></div></div>
  <div class="p-col"><div class="p-label">ノート</div><div class="p-notes" id="pNotes"></div></div>
</div>

/* =========================================================================
   ぜんぶ通す（Perl 版の置換をビルド時に記録したトレースで再生）
   ========================================================================= */
const TR = (window.TRACES || [])[0];
const passJa = p => /^append/.test(p.name) ? '表をくっつける' : /^to-unary/.test(p.name) ? '数字をxに' : /^to-decimal/.test(p.name) ? '数字に戻す'
  : /^mul/.test(p.name) ? (/\+/.test(p.before) ? '掛け算と足し算' : '掛け算') : /^add/.test(p.name) ? 'かっこの中の足し算' : p.name;
const expand = s => s.replace(/x\{(\d+)\}/g, (_, n) => xs(+n));
function toks(s) { // working string -> display tokens
  const at = s.indexOf('@');
  const body = at >= 0 ? s.slice(0, at) : s;
  const out = [];
  for (const t of body.match(/x+|./g) || []) {
    if (t[0] === 'x' && t.length > 16) out.push({ t: 'chip', n: t.length });
    else for (const c of t) out.push({ t: c });
  }
  if (at >= 0) out.push({ t: 'tbl' });
  return out;
}
const tokId = t => t.t === 'chip' ? 'x' : t.t;
function align(ts, prev, kind) {
  const n = ts.length, m = prev.length, L = Array.from({ length: n + 1 }, () => new Int16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    L[i][j] = tokId(ts[i]) === tokId(prev[j]) ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const pairs = [];
  for (let i = 0, j = 0; i < n && j < m;) {
    if (tokId(ts[i]) === tokId(prev[j])) { pairs.push([i, j]); i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) i++; else j++;
  }
  const from = new Array(n).fill(null);
  for (const [i, j] of pairs) from[i] = j;
  // tokens between two matched anchors come from the old tokens between them
  const b = [[-1, -1], ...pairs, [n, m]];
  for (let q = 0; q + 1 < b.length; q++) {
    const src = range('', b[q][1] + 1, b[q + 1][1]).map(Number);
    if (!src.length) continue;
    for (let i = b[q][0] + 1, c = 0; i < b[q + 1][0]; i++) from[i] = src[c++ % src.length];
  }
  if (kind === 'mul') { // the product is copies of the multiplier
    const run = [];
    for (let j = m - 1; j >= 0; j--) { if (tokId(prev[j]) === 'x') run.unshift(j); else if (run.length) break; }
    let c = 0; ts.forEach((t, i) => { if (tokId(t) === 'x') from[i] = run[c++ % run.length]; });
  }
  if (kind === 'dec') { const tb = prev.findIndex(t => t.t === 'tbl'); ts.forEach((t, i) => { if (/\d/.test(t.t) && tb >= 0) from[i] = tb; }); }
  return from;
}
const rowHtml = (row, k, withFrom) => row.ts.map((t, i) => {
  const f = withFrom && row.from[i] != null ? ` data-from="d${k - 1}_${row.from[i]}"` : '';
  const st = f && tokId(t) === 'x' ? ` data-delay="${Math.min(i * 14, 180)}"` : '';
  const a = ` data-k="d${k}_${i}"${f}${st}`;
  const c = row.col[i] || '';
  if (t.t === 'chip') return `<span class="chip g ${c}"${a}>x<span class="sub">×${t.n}</span></span>`;
  if (t.t === 'tbl') return `<span class="chip tbl g"${a}>表</span>`;
  return `<span class="g ${c}"${a}>${E(t.t)}</span>`;
}).join('');
if (TR) {
  // rebuild the whole working string around passes that only see a sub-expression
  let cur = TR.expr, tbl = false;
  const PAL = ['a', 'b', 'p3'];
  const t0 = toks(TR.expr);
  let ni = 0;
  const rows = [{ ts: t0, col: t0.map((t, i) => /\d/.test(t.t) ? (i > 0 && /\d/.test(t0[i - 1].t) ? PAL[(ni - 1) % 3] : PAL[ni++ % 3]) : ''), from: [] }];
  for (const p of TR.passes) {
    const b = expand(p.before).split('@')[0], a = expand(p.after), aBody = a.split('@')[0];
    if (a.includes('@')) tbl = true;
    if (/^to-decimal/.test(p.name)) tbl = false;
    if (cur === b) cur = aBody;
    else if (cur.includes('(' + b + ')')) cur = cur.replace('(' + b + ')', aBody);
    else if (cur.includes(b)) cur = cur.replace(b, aBody);
    else cur = aBody;
    const prev = rows[rows.length - 1];
    const ts = toks(cur + (tbl ? '@' : ''));
    const from = align(ts, prev.ts, /^mul/.test(p.name) ? 'mul' : /^to-decimal/.test(p.name) ? 'dec' : '');
    rows.push({ ts, from, col: ts.map((t, i) => from[i] != null && t.t !== 'tbl' ? prev.col[from[i]] : ''), name: passJa(p), re: p.re, repl: p.repl, flags: p.flags });
  }
  rows[rows.length - 1].col = rows[rows.length - 1].ts.map(() => 'a');
  const cut = (t, n) => t.length > n ? t.slice(0, n) + '…' : t;
  const subst = r => { const rp = cut(r.repl || '', 22); return 's/' + cut(r.re, Math.max(14, 60 - rp.length)) + '/' + rp + '/' + (r.flags || ''); };
  frame({ sec: 2, notes: `最後に、${TR.expr} を Perl で実際に計算してみます。`,
    html: `<div class="f c">${K('demo:h', '<span class="mono">(1+2)*4</span>を計算してみる', 'ovit big')}</div>`, mark: [OVM('demo:h')] });
  frame({ sec: 3, notes: '', html: conv(rowHtml(rows[0], 0, false)) });
  for (let k = 1; k < rows.length; k++) {
    frame({ sec: 3, notes: `${rows[k].name}。`,
      html: conv(rowHtml(rows[k - 1], k - 1, false),
        K('dn' + k, E(rows[k].name), 'tag') + code('re-demo', [line([['dr' + k + '_', subst(rows[k])]])], 'xs'),
        rowHtml(rows[k], k, true)) });
  }
}

    if (need.length) {
      const g = build(F[i].pre);

/* =========================================================================
   Navigation, presenter, sync
   ========================================================================= */
const PRESENTER = /[?&]presenter\b/.test(location.search);
let chan = null;

function post(m) { if (chan && !PRESENTER) chan.postMessage(m); }

function prev() { let j = cur - 1; while (j > 0 && F[j].auto) j--; show(j, true); }

addEventListener('keydown', e => {
  const k = e.key;
  if (['ArrowRight', ' ', 'PageDown', 'Enter', 'ArrowDown'].includes(k)) { e.preventDefault(); PRESENTER ? remote('next') : next(); }
  else if (['ArrowLeft', 'PageUp', 'Backspace', 'ArrowUp'].includes(k)) { e.preventDefault(); PRESENTER ? remote('prev') : prev(); }
  else if (k === 'Home') PRESENTER ? remote('go', 0) : show(0, false);
  else if (k === 'End') PRESENTER ? remote('go', F.length - 1) : show(F.length - 1, false);
  else if (k === 'f' && !PRESENTER) { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
  else if (k === 'n' && !PRESENTER) document.body.classList.toggle('shownotes');
  else if (k === 'p' && !PRESENTER) window.open(location.pathname + '?presenter', 'regexcalc-presenter', 'width=1400,height=860');

function start() {
  if (!PRESENTER) {
    if (chan) chan.onmessage = e => {
      const m = e.data;
      if (m.type === 'cmd') { if (m.cmd === 'next') next(); else if (m.cmd === 'prev') prev(); else if (m.cmd === 'go') show(m.i, false); }
      if (m.type === 'hello') post({ type: 'at', i: cur });
    };
    const h = parseInt(location.hash.slice(1), 10);
    show(isNaN(h) ? 0 : h - 1, false);
    addEventListener('hashchange', () => { const n = parseInt(location.hash.slice(1), 10) - 1; if (!isNaN(n) && n !== cur) show(n, false); });
    return;
  }

  const total = cum[cum.length - 1];
  const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  const fill = (id, i) => {
    const box = document.querySelector(`#${id} .inner`);
    box.innerHTML = i < F.length ? F[i].html : '';
    box.style.transform = `scale(${box.parentElement.clientWidth / 1920})`;
  };
  const render = () => {
    fill('pNow', at); fill('pNext', at + 1);
    document.getElementById('pNotes').textContent = F[at].notes || '';
    document.getElementById('pIdx').textContent = `${at + 1} / ${F.length}`;
  };
  setInterval(() => {
    const el = t0 ? (Date.now() - t0) / 1000 : 0;
    document.getElementById('pClock').textContent = fmt(el);
    const p = document.getElementById('pPlan');
    p.textContent = `予定：${fmt(cum[at])}/${fmt(total)}`;
    p.classList.toggle('late', !!t0 && el > cum[at] + 5);
  }, 250);
  if (chan) {
